<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">mo-hardware · content to delivery</title><desc id="desc">Hardware engineers own material; software maintainers own mapping and automation.</desc><rect width="1120" height="800" rx="20" fill="#f4f8f6"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.h{font-size:30px;font-weight:700;fill:#133d32}.s{font-size:16px;fill:#526b63}.t{font-size:22px;font-weight:700;fill:#153d33}.k{font-size:16px;font-weight:700;fill:#007d52}.p{font-size:15px;fill:#435d54}</style><text class="h" x="40" y="58">mo-hardware · content to delivery</text><text class="s" x="40" y="92">Hardware engineers own material; software maintainers own mapping and automation.</text>
<rect x="40" y="130" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="40" y="130" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="64" y="172">01  Source material</text><text class="k" x="64" y="210">products/ · accessories/</text>
<text class="p" x="64" y="245">Markdown, full attachments, provenance and validation</text>
<text class="p" x="64" y="269">scope.</text>
<rect x="580" y="130" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="580" y="130" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="604" y="172">01  Maintainer training</text><text class="k" x="604" y="210">training/</text>
<text class="p" x="604" y="245">Browser workflow, category guides and practice records.</text>
<rect x="40" y="332" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="40" y="332" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="64" y="374">02  Content and route checks</text><text class="k" x="64" y="412">scripts/ · site/content-map.json</text>
<text class="p" x="64" y="447">Files, path boundaries and collisions; people review</text>
<text class="p" x="64" y="471">facts.</text>
<rect x="580" y="332" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="580" y="332" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="604" y="374">02  Generation and build</text><text class="k" x="604" y="412">site/.generated/ → Docusaurus</text>
<text class="p" x="604" y="447">Pages, navigation, search, downloads and deployment</text>
<text class="p" x="604" y="471">marker.</text>
<rect x="40" y="534" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="40" y="534" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="64" y="576">03  Website delivery</text><text class="k" x="64" y="614">Pages / test platform</text>
<text class="p" x="64" y="649">Shared previews; tagged releases deploy /hardware-</text>
<text class="p" x="64" y="673">docs/.</text>
<rect x="580" y="534" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="580" y="534" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="604" y="576">03  Versioned assets</text><text class="k" x="604" y="614">Release archives + manifest</text>
<text class="p" x="604" y="649">Source/site archives, SHA-256, SPDX and changelogs.</text>
<text class="s" x="40" y="771">Matching version numbers do not imply compatibility. Excel conversion and production hosting remain future work.</text></svg>
