<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">mo-hardware · 内容到发布</title><desc id="desc">硬件工程师维护资料；软件维护者负责映射、构建与自动化。</desc><rect width="1120" height="800" rx="20" fill="#f4f8f6"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.h{font-size:30px;font-weight:700;fill:#133d32}.s{font-size:16px;fill:#526b63}.t{font-size:22px;font-weight:700;fill:#153d33}.k{font-size:16px;font-weight:700;fill:#007d52}.p{font-size:15px;fill:#435d54}</style><text class="h" x="40" y="58">mo-hardware · 内容到发布</text><text class="s" x="40" y="92">硬件工程师维护资料；软件维护者负责映射、构建与自动化。</text>
<rect x="40" y="130" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="40" y="130" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="64" y="172">01  源资料</text><text class="k" x="64" y="210">products/ · accessories/</text>
<text class="p" x="64" y="245">普通 Markdown、完整附件、来源、版本与验证范围。</text>
<rect x="580" y="130" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="580" y="130" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="604" y="172">01  维护培训</text><text class="k" x="604" y="210">training/</text>
<text class="p" x="604" y="245">网页流程、逐项指南与练习；不进入产品网站映射。</text>
<rect x="40" y="332" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="40" y="332" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="64" y="374">02  内容与映射检查</text><text class="k" x="64" y="412">scripts/ · site/content-map.json</text>
<text class="p" x="64" y="447">校验文件、路径、映射冲突；事实由责任人审阅。</text>
<rect x="580" y="332" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="580" y="332" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="604" y="374">02  页面生成与构建</text><text class="k" x="604" y="412">site/.generated/ → Docusaurus</text>
<text class="p" x="604" y="447">页面、导航、搜索、下载与在线标记；不手改生成物。</text>
<rect x="40" y="534" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="40" y="534" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="64" y="576">03  网站交付</text><text class="k" x="64" y="614">Pages / 测试平台</text>
<text class="p" x="64" y="649">共享工程预览；Tag 发布后部署 /hardware-do</text>
<text class="p" x="64" y="673">cs/。</text>
<rect x="580" y="534" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="580" y="534" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="604" y="576">03  版本化产物</text><text class="k" x="604" y="614">Release archives + manifest</text>
<text class="p" x="604" y="649">源码与站点包、SHA-256、SPDX 和 Changel</text>
<text class="p" x="604" y="673">og。</text>
<text class="s" x="40" y="771">版本数字相同不代表兼容。Excel 自动转换与正式平台仍待后续接入。</text></svg>
