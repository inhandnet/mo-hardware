<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 685" role="img" aria-labelledby="title desc"><title id="title">mo-hardware: ownership and delivery</title><desc id="desc">Directories show ownership; README records actual migration completion</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#548879"/></marker></defs><rect width="1200" height="685" rx="18" fill="#f4f8f5"/><g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="14" fill="#007458" font-weight="700">MO / MO-HARDWARE</text><text x="40" y="91" font-size="30" fill="#173d32" font-weight="700">mo-hardware: ownership and delivery</text><text x="40" y="124" font-size="17" fill="#59716a" font-weight="400">Directories show ownership; README records actual migration completion</text><rect x="40" y="182" width="360" height="310" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="62" y="229" font-size="23" fill="#203b36" font-weight="400">Historical hardware source</text><text x="62" y="282" font-size="17" fill="#203b36" font-weight="400">products/ · product records</text><text x="62" y="309" font-size="17" fill="#203b36" font-weight="400">accessories/ · add-on references</text><text x="62" y="336" font-size="17" fill="#203b36" font-weight="400">training/ · maintainer material</text><text x="62" y="363" font-size="17" fill="#203b36" font-weight="400">Historical tags and assets retained</text><path d="M400 339h17" fill="none" stroke="#548879" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="182" width="360" height="310" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="442" y="229" font-size="23" fill="#203b36" font-weight="400">Move to mo-docs/hardware/</text><text x="442" y="282" font-size="17" fill="#203b36" font-weight="400">Preserve bytes, origins and licenses</text><text x="442" y="309" font-size="17" fill="#203b36" font-weight="400">Integrate hardware text and assets</text><text x="442" y="336" font-size="17" fill="#203b36" font-weight="400">Keep maintainer training traceable</text><path d="M780 339h17" fill="none" stroke="#548879" stroke-width="2" marker-end="url(#arrow)"/><rect x="800" y="182" width="360" height="310" rx="14" fill="#fff" stroke="#cbdcd5"/><text x="822" y="229" font-size="23" fill="#203b36" font-weight="400">developer takes over rendering</text><text x="822" y="282" font-size="17" fill="#203b36" font-weight="400">Keep old URLs and download paths</text><text x="822" y="309" font-size="17" fill="#203b36" font-weight="400">Retire old deploy after acceptance</text><text x="822" y="336" font-size="17" fill="#203b36" font-weight="400">Archive separately; retain history</text><rect x="40" y="533" width="1120" height="110" rx="14" fill="#e5f3eb" stroke="#cbdcd5"/><text x="64" y="572" font-size="17" fill="#203b36" font-weight="400">Tutorials stay in mo-docs; executable resources stay with their owners; the website assembles pinned inputs</text><text x="64" y="599" font-size="17" fill="#203b36" font-weight="400">One maintained implementation; related firmware, clients, configuration and evidence stay compatible</text></g></svg>
