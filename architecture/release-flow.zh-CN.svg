<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">mo-hardware · 贡献与发布</title><desc id="desc">主线权限、必需检查与 Tag 不可变性分别保护。</desc><rect width="1120" height="800" rx="20" fill="#f4f8f6"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif}.h{font-size:30px;font-weight:700;fill:#133d32}.s{font-size:16px;fill:#526b63}.t{font-size:22px;font-weight:700;fill:#153d33}.k{font-size:16px;font-weight:700;fill:#007d52}.p{font-size:15px;fill:#435d54}</style><text class="h" x="40" y="58">mo-hardware · 贡献与发布</text><text class="s" x="40" y="92">主线权限、必需检查与 Tag 不可变性分别保护。</text>
<rect x="40" y="130" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="40" y="130" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="64" y="172">01  Write / 贡献者</text><text class="k" x="64" y="210">主题分支 → PR</text>
<text class="p" x="64" y="245">维护内容、提供证据；英文提交与 PR 标题。</text>
<rect x="580" y="130" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="580" y="130" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="604" y="172">01  必需 CI</text><text class="k" x="604" y="210">commit-message + ci</text>
<text class="p" x="604" y="245">检查消息、内容、测试、类型、构建与浏览器。</text>
<rect x="40" y="332" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="40" y="332" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="64" y="374">02  Pages 工程预览</text><text class="k" x="64" y="412">成功的 PR / master CI</text>
<text class="p" x="64" y="447">只部署静态产物；共享槽位，必须核对构建标识。</text>
<rect x="580" y="332" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="580" y="332" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="604" y="374">02  Admin 合并</text><text class="k" x="604" y="412">检查成功 → squash master</text>
<text class="p" x="604" y="447">不强制额外审批；自动删除源分支。</text>
<rect x="40" y="534" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="40" y="534" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="64" y="576">03  Admin 创建 Tag</text><text class="k" x="64" y="614">annotated VX.Y.Z / VX.Y.Z-rcN</text>
<text class="p" x="64" y="649">指向 master 历史；现有 Tag 不允许改写或删除。</text>
<rect x="580" y="534" width="500" height="174" rx="13" fill="white" stroke="#c9ded2"/><rect x="580" y="534" width="6" height="174" rx="3" fill="#00935a"/><text class="t" x="604" y="576">03  Release → 测试部署</text><text class="k" x="604" y="614">校验 → 发布 → deploy-hardware</text>
<text class="p" x="604" y="649">验证在线标记，失败回滚；正式平台尚未接入。</text>
<text class="s" x="40" y="771">版本数字相同不代表兼容。Excel 自动转换与正式平台仍待后续接入。</text></svg>
