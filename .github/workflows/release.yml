name: release

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: mo-hardware-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  REPO_NAME: mo-hardware
  HARDWARE_ENVIRONMENT: test
  HARDWARE_BASE_URL: /hardware-docs/
  HARDWARE_SITE_URL: ${{ vars.WEBSITE_SITE_URL || 'https://developer.inhand.online' }}
  DOCUMENTATION_URL: ${{ vars.DOCUMENTATION_URL || 'https://developer.inhand.online/docs' }}
  DEVELOPER_PORTAL_URL: ${{ vars.DEVELOPER_PORTAL_URL || 'https://developer.inhand.online' }}

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    name: validate-and-package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate tag and source
        run: |
          node scripts/check-release.mjs "$TAG"
      - name: Build inventory and changelogs
        run: |
          node scripts/check-content.mjs
          node scripts/build-manifest.mjs "$TAG" dist/manifest.json
          node scripts/generate-changelog.mjs --version "$TAG" --output dist
      - name: Build deployable hardware site
        run: |
          npm ci
          npm run build
          tar -C site/build -czf "dist/$REPO_NAME-site-$TAG.tar.gz" .
      - name: Package source and material
        run: |
          git archive --format=tar.gz --prefix="$REPO_NAME-$TAG/" \
            -o "dist/$REPO_NAME-$TAG.tar.gz" "refs/tags/$TAG"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: mo-hardware-${{ github.ref_name }}.spdx.json
          output-file: dist/mo-hardware-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksum release files
        run: |
          cd dist
          sha256sum "$REPO_NAME-$TAG.tar.gz" "$REPO_NAME-site-$TAG.tar.gz" "$REPO_NAME-$TAG.spdx.json" \
            manifest.json CHANGELOG.en.md CHANGELOG.zh-CN.md release-notes.md > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: mo-hardware-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    name: publish-github-release
    if: github.repository == 'inhandnet/mo-hardware'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mo-hardware-release-${{ github.ref_name }}
          path: dist/
      - name: Verify files
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=()
          if [[ $TAG == *-rc* ]]; then args+=(--prerelease --latest=false); fi
          gh release create "$TAG" \
            "dist/$REPO_NAME-$TAG.tar.gz" \
            "dist/$REPO_NAME-site-$TAG.tar.gz" \
            "dist/$REPO_NAME-$TAG.spdx.json" \
            dist/manifest.json dist/CHANGELOG.en.md dist/CHANGELOG.zh-CN.md \
            dist/release-notes.md dist/SHA256SUMS \
            --verify-tag --title "$TAG" --notes-file dist/release-notes.md \
            "${args[@]}"
  deploy-test:
    name: deploy-test-platform
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: mo-hardware-deploy-test
      cancel-in-progress: false
    environment: test
    env:
      DEPLOY_HOST: ${{ secrets.OPS_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.OPS_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.OPS_DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.OPS_DEPLOY_HOST_KEY }}
      DEPLOY_URL: ${{ vars.WEBSITE_SITE_URL || 'https://developer.inhand.online' }}/hardware-docs/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: mo-hardware-release-${{ github.ref_name }}
          path: dist/
      - name: Deploy and verify isolated hardware site
        run: bash .github/scripts/deploy-site.sh "dist/$REPO_NAME-site-$TAG.tar.gz"
