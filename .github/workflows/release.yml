name: release

on:
  push:
    tags: ['V*']

permissions:
  contents: read

concurrency:
  group: mo-hardware-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  REPO_NAME: mo-hardware

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    name: validate-and-package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate tag and source
        run: |
          pattern='^V(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$'
          if [[ ! $TAG =~ $pattern ]]; then
            echo '::error::expected VX.Y.Z or VX.Y.Z-rcN'
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          SOURCE_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          test "$SOURCE_COMMIT" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/master
          scripts/check-commit-msg.sh --revs -1 "$SOURCE_COMMIT" --require-bilingual
      - name: Build inventory and bilingual changelog
        run: |
          node scripts/check-content.mjs
          node scripts/build-manifest.mjs "$TAG" dist/manifest.json
          node scripts/generate-changelog.mjs --version "$TAG" --output dist
      - name: Package source and material
        run: |
          git archive --format=tar.gz --prefix="$REPO_NAME-$TAG/" \
            -o "dist/$REPO_NAME-$TAG.tar.gz" "refs/tags/$TAG"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: mo-hardware-${{ github.ref_name }}.spdx.json
          output-file: dist/mo-hardware-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksum release files
        run: |
          cd dist
          sha256sum "$REPO_NAME-$TAG.tar.gz" "$REPO_NAME-$TAG.spdx.json" \
            manifest.json CHANGELOG.en.md CHANGELOG.zh-CN.md release-notes.md > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: mo-hardware-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    name: publish-github-release
    if: github.repository == 'inhandnet/mo-hardware'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mo-hardware-release-${{ github.ref_name }}
          path: dist/
      - name: Verify files
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=()
          if [[ $TAG == *-rc* ]]; then args+=(--prerelease --latest=false); fi
          gh release create "$TAG" \
            "dist/$REPO_NAME-$TAG.tar.gz" \
            "dist/$REPO_NAME-$TAG.spdx.json" \
            dist/manifest.json dist/CHANGELOG.en.md dist/CHANGELOG.zh-CN.md \
            dist/release-notes.md dist/SHA256SUMS \
            --verify-tag --title "$TAG" --notes-file dist/release-notes.md \
            "${args[@]}"
