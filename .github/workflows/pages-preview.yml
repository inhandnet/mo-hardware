name: pages-preview

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-pages-preview
  cancel-in-progress: false

jobs:
  artifact:
    name: prepare-site-preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: '22'
      - name: Build trusted master preview
        if: github.event_name == 'workflow_dispatch'
        env:
          HARDWARE_BASE_URL: /mo-hardware/
          HARDWARE_PREVIEW: '1'
          HARDWARE_PREVIEW_LABEL: master / ${{ github.sha }}
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Download successful read-only CI output
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: hardware-site-preview
          path: site/build/
      - name: Validate static artifact without executing PR code
        run: |
          test -f site/build/index.html
          test -z "$(find site/build -type l -print -quit)"
          printf '## Hardware site preview\n\nCI artifact or trusted master build.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/build
          retention-days: 7
  deploy:
    name: deploy-site-preview
    needs: artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
